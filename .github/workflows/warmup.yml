name: Overnight Cache Warmer

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub dashboard

concurrency:
  group: catalogue-maintenance
  cancel-in-progress: false

jobs:
  warm_cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SCRAPER_DAILY_BUDGET_USD: ${{ vars.SCRAPER_DAILY_BUDGET_USD || '20' }}
      SCRAPER_MAX_REQUESTS_PER_DAY: ${{ vars.SCRAPER_MAX_REQUESTS_PER_DAY || '120' }}
      APIFY_MAX_RUN_COST_USD: ${{ vars.APIFY_MAX_RUN_COST_USD || '1' }}
      ZENROWS_MAX_REQUEST_COST_USD: ${{ vars.ZENROWS_MAX_REQUEST_COST_USD || '1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo xargs -a packages.txt apt-get install -y

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$ZENROWS_KEY" || (echo "Missing GitHub Actions secret: ZENROWS_KEY" && exit 1)
          test -n "$APIFY_TOKEN" || (echo "Missing GitHub Actions secret: APIFY_TOKEN" && exit 1)
          test -n "$GCP_SERVICE_ACCOUNT" || (echo "Missing GitHub Actions secret: GCP_SERVICE_ACCOUNT" && exit 1)

      - name: Run Cache Warmer Script
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          ZENROWS_COST_PER_REQUEST_USD: ${{ vars.ZENROWS_COST_PER_REQUEST_USD }}
        run: python cache_warmer.py
