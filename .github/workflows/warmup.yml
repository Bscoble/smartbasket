name: Overnight Cache Warmer

on:
  schedule:
    # This runs at 18:00 UTC every day (which is 4:00 AM AEST)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub dashboard

jobs:
  warm_cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo xargs -a packages.txt apt-get install -y

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$ZENROWS_KEY" || (echo "Missing GitHub Actions secret: ZENROWS_KEY" && exit 1)
          test -n "$APIFY_TOKEN" || (echo "Missing GitHub Actions secret: APIFY_TOKEN" && exit 1)
          test -n "$GCP_SERVICE_ACCOUNT" || (echo "Missing GitHub Actions secret: GCP_SERVICE_ACCOUNT" && exit 1)

      - name: Run Cache Warmer Script
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python cache_warmer.py
